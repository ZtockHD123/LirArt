<app-header></app-header>

<ion-content>
  <ion-grid fixed>
    <ion-row>

      <ion-col size="12" size-md="3" class="ion-hide-sm-down side-nav-col">
        <app-side-nav></app-side-nav>
      </ion-col>

      <ion-col size="12" size-md="9" class="notifications-col">
        <div class="notifications-container">
          <ion-list-header class="notifications-header">
            <ion-label>Bandeja de Notificaciones</ion-label>
            <ion-icon name="notifications-outline" class="header-icon"></ion-icon>
          </ion-list-header>

          <ion-list lines="none" class="notification-list">
            <ion-card *ngFor="let notification of notifications" class="notification-card">
              <ion-card-content class="notification-item">
                <div class="message" [innerHTML]="notification.message"></div>
                <div class="time">{{ notification.time }}</div>
              </ion-card-content>
            </ion-card>
          </ion-list>
        </div>
      </ion-col>

    </ion-row>
  </ion-grid>
</ion-content>
